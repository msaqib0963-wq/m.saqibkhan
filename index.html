<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Muhammad Saqib's portfolio in mathematics, Excel, Python, data visualization, and AI tools.">
  <meta name="theme-color" content="#0b1220">
  <title>Muhammad Saqib | Mathematics & Data Portfolio</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111c2e;
      --panel-2: #15243a;
      --text: #edf4ff;
      --muted: #a7b6cc;
      --line: rgba(174, 197, 229, .16);
      --accent: #56d6c9;
      --accent-2: #7aa8ff;
      --warm: #f5c778;
      --shadow: 0 18px 50px rgba(0,0,0,.22);
      --radius: 20px;
      --max: 1120px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 84px; }
    body {
      margin: 0; color: var(--text); background:
        radial-gradient(circle at 85% 0%, rgba(54, 109, 173, .16), transparent 28rem),
        radial-gradient(circle at 0% 30%, rgba(49, 184, 170, .08), transparent 26rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }
    a { color: inherit; text-decoration: none; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--warm); outline-offset: 4px; }
    .container { width: min(var(--max), calc(100% - 40px)); margin-inline: auto; }
    .nav-wrap { position: sticky; top: 0; z-index: 20; background: rgba(11,18,32,.84); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
    nav { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: -.03em; }
    .brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #071321; font-weight: 900; }
    .nav-links { display: flex; gap: 22px; align-items: center; color: var(--muted); font-size: .92rem; }
    .nav-links a:hover { color: var(--accent); }
    .menu-btn { display: none; border: 1px solid var(--line); color: var(--text); background: var(--panel); border-radius: 10px; padding: 8px 12px; font-size: 1rem; }
    .hero { padding: 88px 0 70px; display: grid; grid-template-columns: 1.25fr .75fr; align-items: center; gap: 54px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: var(--accent); border: 1px solid rgba(86,214,201,.25); background: rgba(86,214,201,.07); padding: 6px 12px; border-radius: 999px; font-size: .82rem; font-weight: 700; }
    .dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 0 5px rgba(86,214,201,.12); }
    h1 { font-size: clamp(2.65rem, 6vw, 5rem); line-height: 1.04; letter-spacing: -.065em; margin: 22px 0 18px; }
    .gradient-text { background: linear-gradient(100deg, var(--accent), #9ac3ff 70%); color: transparent; background-clip: text; -webkit-background-clip: text; }
    .hero p { max-width: 650px; color: var(--muted); font-size: 1.08rem; margin: 0 0 26px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; border: 1px solid var(--line); border-radius: 12px; padding: 11px 17px; font-weight: 750; transition: transform .2s, border-color .2s, background .2s; }
    .btn:hover { transform: translateY(-2px); border-color: rgba(86,214,201,.55); }
    .btn-primary { background: var(--accent); color: #071321; border-color: transparent; }
    .btn-secondary { background: rgba(255,255,255,.025); color: var(--text); }
    
    /* Profile Card */
    .profile-card { padding: 16px; background: linear-gradient(145deg, rgba(21,36,58,.94), rgba(13,23,39,.94)); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); text-align: center; }
    .profile-img { width: 100%; max-height: 320px; object-fit: cover; border-radius: 18px; border: 1px solid var(--line); margin-bottom: 14px; display: block; }
    
    .visual-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: .8rem; margin-bottom: 14px; }
    .window-dots { display: flex; gap: 5px; }
    .window-dots i { width: 7px; height: 7px; display: block; border-radius: 50%; background: #40516a; }
    .chart-box { background: rgba(5,12,23,.65); border: 1px solid var(--line); border-radius: 17px; padding: 12px; display: flex; justify-content: center; align-items: center; }
    .chart-box svg { width: 100%; height: auto; max-height: 150px; }
    
    .stat-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin-top: 12px; }
    .stat { background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: 13px; padding: 11px; }
    .stat strong { display: block; font-size: 1rem; color: var(--text); }
    .stat span { display: block; color: var(--muted); font-size: .7rem; }
    section { padding: 64px 0; }
    .section-head { max-width: 700px; margin-bottom: 28px; }
    .kicker { color: var(--accent); font-size: .78rem; font-weight: 850; text-transform: uppercase; letter-spacing: .15em; }
    h2 { margin: 7px 0 10px; font-size: clamp(1.9rem, 4vw, 2.7rem); line-height: 1.15; letter-spacing: -.045em; }
    .section-head p, .muted { color: var(--muted); }
    .about-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 20px; }
    .panel { background: linear-gradient(145deg, rgba(17,28,46,.95), rgba(14,24,40,.95)); border: 1px solid var(--line); border-radius: var(--radius); padding: 25px; }
    .panel p { color: var(--muted); margin: 8px 0 0; }
    .facts { display: grid; gap: 12px; }
    .fact { display: flex; gap: 12px; align-items: flex-start; }
    .fact-icon { flex: 0 0 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: rgba(86,214,201,.1); color: var(--accent); font-weight: 850; }
    .fact strong { display: block; }
    .fact span { color: var(--muted); font-size: .9rem; }
    .skills-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 15px; }
    .skill-card { background: var(--panel); border: 1px solid var(--line); border-radius: 17px; padding: 20px; }
    .skill-icon { width: 45px; height: 45px; border-radius: 13px; display: grid; place-items: center; background: rgba(122,168,255,.12); color: var(--accent-2); font-weight: 900; font-size: 1.05rem; margin-bottom: 15px; }
    .skill-card h3, .project-card h3 { margin: 0 0 7px; font-size: 1.08rem; }
    .skill-card p, .project-card p { color: var(--muted); margin: 0; font-size: .92rem; }
    .tag-list { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 14px; }
    .tag { font-size: .75rem; color: #c9d8ed; background: rgba(255,255,255,.045); border: 1px solid var(--line); padding: 4px 9px; border-radius: 999px; }
    .projects-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; }
    .project-card { overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 19px; }
    .project-art { min-height: 150px; padding: 15px; display: flex; align-items: center; justify-content: center; background: linear-gradient(130deg, rgba(86,214,201,.12), rgba(122,168,255,.12)); border-bottom: 1px solid var(--line); }
    .project-content { padding: 20px; }
    .project-type { color: var(--accent); font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; }
    .project-link { display: inline-block; margin-top: 14px; color: var(--accent); font-size: .88rem; font-weight: 750; }
    .notice { border: 1px dashed rgba(245,199,120,.4); border-radius: 13px; padding: 13px 15px; color: var(--muted); font-size: .88rem; margin-top: 17px; }
    .certificate { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px; }
    .cert-icon { width: 60px; height: 60px; border-radius: 17px; display: grid; place-items: center; background: rgba(245,199,120,.12); color: var(--warm); font-size: 1.5rem; }
    .certificate h3 { margin: 0 0 4px; }
    .certificate p { margin: 0; color: var(--muted); font-size: .92rem; }

    .certificate-image-wrap { margin-top: 18px; }
    .certificate-image { display: block; width: 100%; max-width: 850px; height: auto; margin: 0 auto; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
    .certificate-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .contact-link { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); color: var(--muted); gap: 12px; }
    .contact-link:last-child { border-bottom: 0; }
    .contact-link:hover { color: var(--accent); }
    .contact-note { background: rgba(86,214,201,.06); border: 1px solid rgba(86,214,201,.17); padding: 16px; border-radius: 14px; color: var(--muted); font-size: .92rem; }
    footer { border-top: 1px solid var(--line); padding: 24px 0 35px; color: var(--muted); font-size: .86rem; }
    .footer-row { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .top-link { color: var(--accent); }
